name: Deploy to Vultr Compute

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend + Frontend to Vultr
    runs-on: ubuntu-latest
    env:
      VULTR_HOST_CHECK: ${{ secrets.VULTR_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Backend Tests
        working-directory: backend
        run: dotnet test Levvy.slnx --configuration Release

      - name: Publish Levvy.Api
        working-directory: backend
        run: dotnet publish src/Levvy.Api/Levvy.Api.csproj --configuration Release --output ../publish/api

      - name: Install & Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        run: |
          npm ci
          npm run build

      - name: Upload Backend Artifact to Vultr Compute
        if: ${{ env.VULTR_HOST_CHECK != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          source: "publish/api/*"
          target: "/opt/levvy"
          strip_components: 2

      - name: Restart Services on Vultr Compute
        if: ${{ env.VULTR_HOST_CHECK != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            sudo systemctl restart levvy-api || true
            sudo systemctl status levvy-api --no-pager || true
